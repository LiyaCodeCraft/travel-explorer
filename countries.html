<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose Your Country - Travel Explorer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="nav-links">
      <a href="index.html" class="nav-btn">Home</a>
      <a href="countries.html" class="nav-btn active">Countries</a>
      <a href="about.html" class="nav-btn">About us</a>
    </div>

    <!-- Mobile Hamburger Menu Button -->
    <div class="menu-icon" id="menu-toggle">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <!-- Mobile Dropdown Menu -->
    <div class="mobile-menu" id="mobile-menu">
      <a href="index.html">Home</a>
      <a href="countries.html">Countries</a>
      <a href="about.html">About us</a>
    </div>
  </header>

  <main class="main-content">
    <!-- Header & Integrated Search Bar -->
    <div class="search-header">
      <h1 class="hero-title slide-in">Choose Your Country</h1>
      <div class="search-container slide-in">
        <input type="text" id="country-search" placeholder="🔍 Search country..." onkeyup="filterCountries()">
      </div>
    </div>
    
    <!-- Dynamic Grid for ALL World Countries -->
    <div class="countries-grid slide-in delay-1" id="countries-container">
      <!-- Generated dynamically by index.js -->
    </div>
  </main>

  <script src="index.js"></script>
</body>
</html>
